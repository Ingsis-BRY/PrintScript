name: CI

on:
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

permissions: 
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        
      - name: Run check
        run: ./gradlew check
        

